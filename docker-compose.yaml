name: Pokénini Back

services:
  moco.api:
    build:
      context: ./.docker/moco
      args:
        MOCO_VERSION: 1.5.0
    volumes:
      - ./tests/resources/moco/Api/:/var/moco:ro
    command: "/var/moco/moco.json"

  moco.oauth2:
    build:
      context: ./.docker/moco
      args:
        MOCO_VERSION: 1.5.0
    volumes:
      - ./tests/resources/moco/OAuth/:/var/moco:ro
    command: "/var/moco/moco.json"

  php:
    build:
      context: .
      dockerfile: ./.docker/php/Dockerfile
      target: php_dev
    volumes:
      - .:/app
    environment:
      - PHP_CS_FIXER_IGNORE_ENV=1
    tty: true

  redis:
    image: redis:8.6.2-alpine3.23
    volumes:
      - redis_data:/data
    command: redis-server --requirepass douze
    restart: always

  web:
    image: nginx:1.29.8-alpine3.23
    volumes:
      - .:/app
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./.docker/nginx/conf.d:/etc/nginx/conf.d
    ports:
      - '127.0.0.1:8081:8080'

volumes:
  redis_data:  
