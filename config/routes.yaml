controllers:
  resource:
    path: ../src/Controller/
    namespace: App\Controller
  type: attribute
  prefix: /
  trailing_slash_on_root: false

index:
  path: /
  redirect_to_route: app_home_index
  defaults:
    permanent: true

# Fake route for OAuth2 clients to redirect to after authentication
app_connect_google_check:
  path: /
  controller: Symfony\Component\Routing\Controller\RedirectController
app_connect_discord_check:
  path: /
  controller: Symfony\Component\Routing\Controller\RedirectController

when@test: &routes_test
  app_connect_mock_check:
    path: /
    controller: Symfony\Component\Routing\Controller\RedirectController

when@dev: *routes_test
